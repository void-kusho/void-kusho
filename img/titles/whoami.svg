<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 52" width="860" height="52" role="img" aria-label="whoami">
  <style>
    .mono { font-family: "Fira Code","JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:15px; }
    .ps  { fill:#7aa2f7 }
    .dim { fill:#565f89 }
    .fg  { fill:#c0caf5 }
  </style>
  <defs><clipPath id="r"><rect width="860" height="52" rx="8"/></clipPath></defs>
